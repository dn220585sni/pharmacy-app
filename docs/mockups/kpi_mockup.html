<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Мокап: показники за зміну</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F4F5F8; font-family: Roboto, "Segoe UI", Arial, sans-serif; color: #1C1C2E; font-size: 13px; }
  .stage { display: flex; gap: 24px; padding: 20px; align-items: flex-start; flex-wrap: wrap; }
  .panel { width: 420px; background: #F4F5F8; border: 1px dashed #D1D5DB; border-radius: 12px; padding: 16px; }
  .caption { font-size: 11px; color: #9CA3AF; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .5px; }

  .section { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: #6B7280; letter-spacing: .5px; margin-bottom: 10px; }
  .section svg { width: 14px; height: 14px; fill: #9CA3AF; }
  /* секції всередині картки деталізації розділяємо явно: відступ + лінія */
  .card .section { margin-top: 18px; padding-top: 14px; border-top: 1px solid #E5E7EB; }
  .card .row2 { margin-bottom: 0; }

  .card { background: #fff; border: 1px solid #E5E7EB; border-radius: 10px; padding: 12px 14px; }
  .earned { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .coin { width: 48px; height: 48px; border-radius: 50%; background: #F0C64E; border: 1.5px solid #C48F1C; display: grid; place-items: center; }
  .coin i { width: 40px; height: 40px; border-radius: 50%; background: #FFE241; display: grid; place-items: center; font-style: normal; font-weight: 900; color: #008ECC; font-size: 12px; }
  .earned .lbl { font-size: 11px; color: #6B7280; font-weight: 500; }
  .earned .val { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }

  /* перемикач: 32 px, фон #EEF0F3, активний білий з тінню */
  .seg { display: flex; height: 32px; background: #EEF0F3; border-radius: 9px; padding: 3px; margin: 0 0 12px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 0 10px; border-radius: 7px; font: inherit; font-size: 12px; font-weight: 600; color: #6B7280; cursor: pointer; }
  .seg button.on { background: #fff; color: #1E7DC8; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* картка показників: рядки з роздільниками */
  .kpis { background: #fff; border: 1px solid #E5E7EB; border-radius: 10px; padding: 0 14px; }
  .kpi { padding: 12px 0; cursor: pointer; border-bottom: 1px solid #F0F2F5; margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
  .kpi:last-child { border-bottom: 0; }
  .kpi:first-child { border-radius: 10px 10px 0 0; }
  .kpi:last-child { border-radius: 0 0 10px 10px; }
  .kpi:hover { background: #F8F9FB; }
  .kpi .head { display: flex; align-items: center; margin-bottom: 7px; }
  .kpi .name { font-weight: 600; font-size: 13px; }
  .kpi .chev { margin-left: 4px; color: #9CA3AF; font-size: 14px; line-height: 1; }
  .badge { margin-left: auto; padding: 2px 8px; border-radius: 10px; background: #F0F2F5; color: #1C1C2E; font-weight: 600; font-size: 12px; }
  .badge.good { background: #E7F6EC; color: #15803D; }
  .badge.warn { background: #FEF3C7; color: #B45309; }
  .track { position: relative; height: 8px; background: #E5E7EB; border-radius: 4px; }
  .track > div { height: 100%; background: #1E7DC8; border-radius: 4px; }
  .track .pace { position: absolute; top: -2px; width: 1px; height: 12px; background: #9CA3AF; }
  .sub { display: flex; justify-content: space-between; align-items: baseline; margin-top: 5px; }
  .sub .fact { font-size: 13px; font-weight: 700; color: #1C1C2E; }
  .sub .plan { font-size: 11px; color: #6B7280; }

  /* шкала ЗФ */
  .zf { position: relative; padding: 16px 0 20px; }
  .zf .bar { display: flex; height: 30px; border-radius: 8px; overflow: hidden; font-weight: 700; font-size: 14px; color: #fff; }
  .zf .lo { background: #EF8F8F; display: grid; place-items: center; }
  .zf .hi { background: #A9C6E8; display: grid; place-items: center; }
  .zf .tgt { position: absolute; top: 16px; height: 30px; width: 3px; background: #4B5563; border-radius: 2px; transform: translateX(-50%); }
  .zf .cur { position: absolute; top: 12px; width: 3px; height: 38px; background: #4B5563; transform: translateX(-50%); }
  .zf .cur::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; border-radius: 50%; background: #1E7DC8; border: 2px solid #fff; transform: translateX(-50%); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .zf .curlbl { position: absolute; top: 52px; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: #1C1C2E; white-space: nowrap; }
  .zf .month { position: absolute; top: 0; transform: translateX(-50%); font-size: 10px; color: #6B7280; white-space: nowrap; }
  .zf .month::after { content: ""; position: absolute; left: 50%; top: 13px; width: 1px; height: 5px; background: #9CA3AF; }

  /* деталізація */
  .det .top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .det .back { border: 0; background: #fff; border: 1px solid #E5E7EB; border-radius: 7px; padding: 5px 9px; font: inherit; font-size: 12px; color: #1E7DC8; cursor: pointer; }
  .det h3 { margin: 0; font-size: 15px; }
  .big { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .big b { font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
  .big span { font-size: 12px; color: #6B7280; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 12px 0; }
  .stat { background: #F8F9FB; border-radius: 8px; padding: 8px 10px; }
  .stat .l { font-size: 10px; color: #6B7280; text-transform: uppercase; letter-spacing: .3px; }
  .stat .v { font-size: 15px; font-weight: 700; margin-top: 2px; }
  .chart { position: relative; height: 90px; display: flex; align-items: flex-end; gap: 3px; margin: 6px 0 4px; border-bottom: 1px solid #E5E7EB; }
  .chart i { flex: 1; background: #BFD6EE; border-radius: 2px 2px 0 0; }
  .chart i.today { background: #1E7DC8; }
  .chart i.met { background: #22C55E; }
  .chart i.below { background: #E5E7EB; }
  .chart .goal { position: absolute; left: 0; right: 0; border-top: 2px dashed #EF8F8F; }
  .chart .goal span { position: absolute; right: 0; top: -14px; font-size: 10px; color: #B91C1C; font-weight: 700; }
  .axis { display: flex; justify-content: space-between; font-size: 10px; color: #9CA3AF; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-size: 10px; color: #6B7280; text-transform: uppercase; letter-spacing: .3px; font-weight: 600; padding: 4px 0; border-bottom: 1px solid #E5E7EB; }
  td { padding: 6px 0; border-bottom: 1px solid #F0F2F5; }
  td.r, th.r { text-align: right; }
  .note { font-size: 11px; color: #6B7280; margin-top: 8px; }

  /* календар виконання денного плану */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px 4px; margin: 8px 0 6px; }
  .cal .dow { text-align: center; font-size: 10px; color: #9CA3AF; text-transform: uppercase; letter-spacing: .3px; padding-bottom: 2px; }
  .cal .d { display: grid; place-items: center; }
  .cal .d i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 600; color: #6B7280; background: #F0F2F5; }
  .cal .d.met i { background: #22C55E; color: #fff; }
  .cal .d.miss i { background: #E5E7EB; color: #6B7280; }
  .cal .d.today i { background: #1E7DC8; color: #fff; font-weight: 800; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #1E7DC8; }
  .cal .d.future i { background: transparent; color: #C4C9D2; font-weight: 500; cursor: default; }
  .cal .d.empty i { visibility: hidden; }
  .cal .d.past i { cursor: pointer; }
  .cal .d.past i:hover { filter: brightness(.93); }
  .cal .d.sel i { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #1E7DC8; }
  .row2.two { grid-template-columns: 1fr 1fr; }

  /* ЗФ: плашка «золота фішка» як у головній таблиці (тепле коло + бали) */
  .zfb { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #F5F0E8; color: #6B7280; font-size: 11px; font-weight: 500; margin-right: 8px; vertical-align: middle; flex: none; }
  td .zfrow { display: flex; align-items: center; }
  td .zfname { line-height: 1.25; }
  td.pts { color: #15803D; font-weight: 600; }

  /* ВТМ: бонус, накопичення за місяць, заміни, категорії */
  .bonus { display: flex; align-items: center; gap: 10px; background: #E7F6EC; border: 1px solid #22C55E40; border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; }
  .bonus .ic { width: 40px; height: 40px; border-radius: 50%; background: #22C55E; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 12px; letter-spacing: -.3px; flex: none; }
  .bonus .t { font-size: 12px; color: #15803D; font-weight: 700; }
  .bonus .s { font-size: 11px; color: #166534; margin-top: 2px; }
  .cum { position: relative; margin: 4px 0 2px; }
  .cum svg { width: 100%; height: auto; display: block; }
  .cum .lbl { font-size: 10px; fill: #6B7280; }
  .cum .lblb { font-size: 10px; fill: #1E7DC8; font-weight: 700; }
  .stat .v.good { color: #15803D; }
  .stat .v.warn { color: #B45309; }
  td .swap { font-size: 11px; color: #15803D; margin-top: 2px; }
  tr.tot td { font-weight: 700; border-bottom: 0; }
  .cat { margin: 6px 0 8px; }
  .cat-h { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .cat-n { color: #6B7280; font-size: 11px; }
  .cat-n b { color: #1C1C2E; }

  /* активність: дугова шкала зміни */
  .act { position: relative; margin: 4px 0 0; }
  .act svg { width: 100%; height: auto; display: block; }
  .act .ev { cursor: pointer; }
  .act .tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid #E5E7EB; border-radius: 8px; padding: 6px 10px; font-size: 13px; color: #1C1C2E; box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; transform: translate(-50%, -120%); display: none; }
  .act .sum { position: absolute; left: 0; right: 0; top: 46%; text-align: center; pointer-events: none; }
  .act .sum b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
  .act .sum span { font-size: 11px; color: #6B7280; }
  .act .tm { font-size: 10px; fill: #6B7280; }
  .tsel { font-size: 11px; color: #6B7280; font-weight: 500; margin-left: auto; text-transform: none; letter-spacing: 0; }
  td.better { color: #15803D; font-weight: 600; }
  td.worse { color: #B45309; font-weight: 600; }
  .legend { display: flex; gap: 14px; font-size: 11px; color: #6B7280; margin: 8px 0 4px; }
  .legend b { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .hint { background: #FFF8E1; border: 1px solid #FCD34D66; border-radius: 8px; padding: 8px 10px; font-size: 11px; color: #92400E; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="stage">
  <div>
    <p class="caption">Інтерактивно: перемикайте, клікайте по показниках</p>
    <div class="panel" id="app"></div>
  </div>
</div>

<script>
const DATA = {
  my: {
    title: 'Мої показники',
    earned: '47,35',
    turnover: { fact: 3200, plan: 5000, checks: 18, avg: 177.78 },
    vtm:      { fact: 2100, plan: 3000, share: 65.6 },
    zf:       { cur: 13.67, target: 13, monthElapsed: 76.7, checksWithZf: 11, checksTotal: 18,
                days: [9.1,10.4,11.2,12.0,11.8,12.9,13.1,12.4,13.6,14.0,13.2,12.8,13.5,13.9,14.2,13.0,12.6,13.4,13.8,14.1,13.3,13.5,13.67],
                top: [['Аскорбінова к-та ЗФ 500 мг №30','4','128,00'],['Вітамін D3 ЗФ 2000 МО №60','3','387,00'],['Магній B6 ЗФ №50','2','246,00'],['Омега-3 ЗФ №30','1','215,00']] },
  },
  pharmacy: {
    title: 'Показники аптеки',
    earned: null,
    turnover: { fact: 41200, plan: 60000, checks: 236, avg: 174.58 },
    vtm:      { fact: 26800, plan: 36000, share: 65.0 },
    zf:       { cur: 12.41, target: 13, monthElapsed: 76.7, checksWithZf: 121, checksTotal: 236,
                days: [10.2,10.8,11.0,11.6,11.9,12.3,12.0,12.5,12.2,12.8,12.6,12.1,12.4,12.9,12.7,12.3,12.0,12.6,12.5,12.8,12.4,12.3,12.41],
                top: [['Аскорбінова к-та ЗФ 500 мг №30','41','1 312,00'],['Вітамін D3 ЗФ 2000 МО №60','27','3 483,00'],['Магній B6 ЗФ №50','19','2 337,00'],['Омега-3 ЗФ №30','12','2 580,00']] },
  },
};
const fmt = n => n.toLocaleString('uk-UA', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).replace(/ |\s/g, ' ');
const pct = (n, d = 2) => n.toFixed(d).replace('.', ',') + '%';
const ICON = '<svg viewBox="0 0 24 24"><path d="M5 9h3v11H5zM10.5 4h3v16h-3zM16 12h3v8h-3z"/></svg>';

let scope = 'my', view = 'list';

const SHIFT_ELAPSED = 62; // % зміни, що минула (для рисочки темпу)
function badgeCls(p) { return p >= 100 ? 'good' : p < 70 ? 'warn' : ''; }
function track(ratio, pace) {
  return `<div class="track"><div style="width:${Math.min(ratio, 1) * 100}%"></div>${pace ? `<div class="pace" style="left:${pace}%" title="пройшло ${pace}%"></div>` : ''}</div>`;
}
function kpiBar(name, m, key) {
  const p = Math.round(m.fact / m.plan * 100);
  return `<div class="kpi" onclick="showView('${key}')">
    <div class="head"><span class="name">${name}</span><span class="chev">›</span><span class="badge ${badgeCls(p)}">${p}%</span></div>
    ${track(m.fact / m.plan, SHIFT_ELAPSED)}
    <div class="sub"><span class="fact">${fmt(m.fact)}</span><span class="plan">план ${fmt(m.plan)}</span></div>
  </div>`;
}

// шкала: 0 … target·1.3, ціль стоїть на ~77% ширини
function zfScale(z) {
  const max = z.target * 1.3;
  const tx = z.target / max * 100, cx = Math.min(z.cur / max, 1) * 100, mx = z.monthElapsed;
  return `<div class="zf">
    <div class="month" style="left:${mx}%">пройшло місяця ${pct(z.monthElapsed, 1)}</div>
    <div class="bar"><div class="lo" style="width:${tx}%">0 – ${z.target}%</div><div class="hi" style="width:${100 - tx}%">${z.target}%+</div></div>
    <div class="tgt" style="left:${tx}%"></div>
    <div class="cur" style="left:${cx}%"></div>
    <div class="curlbl" style="left:${cx}%">${pct(z.cur)}</div>
  </div>`;
}
function zfBadge(z) {
  const d = z.cur - z.target, cls = d >= 0 ? 'good' : (d > -1 ? 'warn' : 'bad');
  return `<span class="badge ${cls}">${pct(z.cur)}</span>`;
}
function zfRow(z) {
  const p = Math.round(z.cur / z.target * 100);
  return `<div class="kpi" onclick="showView('zf')">
    <div class="head"><span class="name">Частка ЗФ</span><span class="chev">›</span><span class="badge ${badgeCls(p)}">${p}%</span></div>
    ${track(z.cur / z.target, Math.round(z.monthElapsed))}
    <div class="sub"><span class="fact">${pct(z.cur)}</span><span class="plan">план ${z.target}%</span></div>
  </div>`;
}

function seg() {
  return `<div class="seg">
    <button class="${scope==='my'?'on':''}" onclick="setScope('my')">Мої показники</button>
    <button class="${scope==='pharmacy'?'on':''}" onclick="setScope('pharmacy')">Показники аптеки</button>
  </div>`;
}
function earned(d) {
  if (!d.earned) return '';
  return `<div class="card earned"><div class="coin"><i>АНЦ</i></div><div><div class="lbl">Нараховано з початку зміни</div><div class="val">${d.earned}</div></div></div>`;
}

function chart(days, target, unit) {
  const max = Math.max(...days, target) * 1.1;
  const bars = days.map((v, i) => `<i style="height:${v / max * 100}%" class="${i === days.length - 1 ? 'today' : ''}${target ? (v < target ? ' below' : ' met') : ''}" title="${i + 1}.09: ${v}${target && v < target ? ' — нижче плану' : ''}"></i>`).join('');
  const goal = target ? `<div class="goal" style="bottom:${target / max * 100}%"><span>план ${target}${unit}</span></div>` : '';
  return `<div class="chart">${goal}${bars}</div><div class="axis"><span>1 вер</span><span>сьогодні, 23 вер</span></div>`;
}

function detailZf(d) {
  const z = d.zf, diff = z.cur - z.target, p = Math.round(z.cur / z.target * 100);
  const isPh = scope === 'pharmacy', k = isPh ? 12 : 1;
  // ЗФ-товари, продані за зміну: [назва, бали за уп., к-сть, сума]
  const sold = [
    ['Аскорбінова к-та ЗФ 500 мг №30', 3, 4 * k, 128 * k],
    ['Вітамін D3 ЗФ 2000 МО №60', 8, 3 * k, 387 * k],
    ['Магній B6 ЗФ №50', 6, 2 * k, 246 * k],
    ['Омега-3 ЗФ №30', 10, 1 * k, 215 * k],
  ];
  const soldPts = sold.reduce((s, r) => s + r[1] * r[2], 0);
  // Пропущені ЗФ: продано звичайний товар, хоча в наявності був ЗФ-аналог
  const missed = [
    ['Магне-B6 №50', 'Магній B6 ЗФ №50', 6, 3 * k],
    ['Аквадетрим 15 000 МО', 'Вітамін D3 ЗФ 2000 МО №60', 8, 2 * k],
    ['Супрадин №30', 'Мультивітамін ЗФ №30', 5, 2 * k],
  ];
  const missedPts = missed.reduce((s, r) => s + r[2] * r[3], 0);
  return `<div class="det">
    <div class="top"><button class="back" onclick="showView('list')">‹ Назад</button><h3>Частка ЗФ · ${d.title.toLowerCase()}</h3></div>
    <div class="card">
      <div class="big"><b>${pct(z.cur)}</b><span>план на вересень ${z.target}%</span><span class="badge ${badgeCls(p)}">${p}%</span></div>
      <div style="margin-top:6px">${track(z.cur / z.target, Math.round(z.monthElapsed))}</div>
      <div class="row2">
        <div class="stat"><div class="l">До плану</div><div class="v ${diff >= 0 ? 'good' : 'warn'}">${diff >= 0 ? '+' : '−'}${Math.abs(diff).toFixed(2).replace('.', ',')} п.п.</div></div>
        <div class="stat"><div class="l">Чеків із ЗФ</div><div class="v">${z.checksWithZf} / ${z.checksTotal}</div></div>
        <div class="stat"><div class="l">Балів за ЗФ сьогодні</div><div class="v">${fmt(soldPts)}</div></div>
      </div>

      <div class="section">${ICON} ЧАСТКА ЗФ ПО ДНЯХ <span class="tsel">накопичено з 1 вересня</span></div>
      ${chart(z.days, z.target, '%')}
      <div class="legend" style="margin-top:0"><span><b style="background:#22C55E"></b>план виконано</span><span><b style="background:#E5E7EB"></b>не виконано</span><span><b style="background:#1E7DC8"></b>сьогодні</span></div>
      <div class="note" style="margin-bottom:0">Частка ЗФ = продажі товарів із золотою фішкою / загальний товарообіг, наростаючим підсумком за місяць. Оцінюється результат за місяць.</div>

      <div class="section">${ICON} ПРОПУЩЕНО ЗФ <span class="tsel">сьогодні</span></div>
      <table><tr><th>Продано → є ЗФ-аналог</th><th class="r">К-сть</th><th class="r">Бали</th></tr>
      ${missed.map(r => `<tr><td>${r[0]}<div class="swap">→ ${r[1]}</div></td><td class="r">${r[3]}</td><td class="r pts">+${r[2] * r[3]}</td></tr>`).join('')}
      <tr class="tot"><td>Разом</td><td class="r">${missed.reduce((s, r) => s + r[3], 0)}</td><td class="r pts">+${missedPts}</td></tr></table>
      <div class="note" style="margin-bottom:0">Чеки, де клієнт узяв товар без золотої фішки, хоча в наявності був ЗФ-аналог. Бали — скільки додала б заміна.</div>

      <div class="section">${ICON} ПРОДАНО ЗФ ЗА ЗМІНУ <span class="tsel">${sold.reduce((s, r) => s + r[2], 0)} уп.</span></div>
      <table><tr><th>Товар</th><th class="r">К-сть</th><th class="r">Сума</th><th class="r">Бали</th></tr>
      ${sold.map(r => `<tr><td>${r[0]}</td><td class="r">${r[2]}</td><td class="r">${fmt(r[3])},00</td><td class="r pts">+${r[1] * r[2]}</td></tr>`).join('')}
      <tr class="tot"><td>Разом</td><td class="r">${sold.reduce((s, r) => s + r[2], 0)}</td><td class="r">${fmt(sold.reduce((s, r) => s + r[3], 0))},00</td><td class="r pts">+${soldPts}</td></tr></table>
    </div>
  </div>`;
}
// Календар місяця: день із виконаним денним планом — зелений, без — сірий,
// сьогодні — синій з кільцем, майбутні — без кружечка.
let selDay = 23; // обрана дата в календарі (за замовчуванням сьогодні)
function selectDay(n) { selDay = n; render(); }

function calendar(dayFacts, dayPlan, today, year, month) {
  const first = new Date(year, month - 1, 1).getDay();      // 0=Нд
  const lead = (first + 6) % 7;                              // зсув до Пн
  const total = new Date(year, month, 0).getDate();
  const dows = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(x => `<div class="dow">${x}</div>`).join('');
  let cells = '';
  for (let i = 0; i < lead; i++) cells += `<div class="d empty"><i>0</i></div>`;
  for (let day = 1; day <= total; day++) {
    let cls, title = '', click = '';
    if (day === today) { cls = 'today past'; title = `сьогодні: ${fmt(dayFacts[day - 1])} з ${fmt(dayPlan)}`; }
    else if (day > today) cls = 'future';
    else { const ok = dayFacts[day - 1] >= dayPlan; cls = (ok ? 'met' : 'miss') + ' past'; title = `${fmt(dayFacts[day - 1])} з ${fmt(dayPlan)} ${ok ? '✓' : ''}`; }
    if (day <= today) click = ` onclick="selectDay(${day})"`;
    if (day === selDay && day !== today) cls += ' sel';
    cells += `<div class="d ${cls}" title="${title}"${click}><i>${day}</i></div>`;
  }
  return `<div class="cal">${dows}${cells}</div>
    <div class="legend"><span><b style="background:#22C55E"></b>план виконано</span><span><b style="background:#E5E7EB"></b>не виконано</span><span><b style="background:#1E7DC8"></b>сьогодні</span></div>`;
}

// ── Активність: дугова шкала зміни ────────────────────────────────────────
// Події зміни на ¾-дузі (початок зміни зліва внизу → кінець справа внизу).
// Підказка з типом і часом — лише при наведенні на рисочку.
const ACT_TYPES = {
  cash:  { label: 'Чек, готівка',       color: '#8FCB86' },
  card:  { label: 'Чек, картка',        color: '#5FB556' },
  iz:    { label: 'Збір ІЗ',            color: '#5B9BE0' },
  reimb: { label: 'Чек, Реімбурсація',  color: '#F2C94C' },
  doc:   { label: 'АНЦДок',             color: '#B59BE0' },
};
function mockEvents(day) {
  // детермінований псевдовипадковий список подій 08:00–20:00
  let s = day * 9973 + 17;
  const rnd = () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
  const n = 34 + Math.floor(rnd() * 14), ev = [];
  for (let i = 0; i < n; i++) {
    const t = 8 * 60 + Math.floor(rnd() * 12 * 60);
    const r = rnd();
    const type = r < .62 ? 'cash' : r < .80 ? 'card' : r < .88 ? 'iz' : r < .95 ? 'reimb' : 'doc';
    ev.push({ t, type });
  }
  return ev.sort((a, b) => a.t - b.t);
}
const hhmm = t => `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;

// Присутність клієнтів у торговому залі (мок; реально — окремий сервіс/датчик).
// Інтервали [від, до] у хвилинах від опівночі.
function mockPresence(day) {
  let s = day * 7919 + 3;
  const rnd = () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
  const out = [];
  let t = 8 * 60 + 5;
  while (t < 20 * 60 - 10) {
    const len = 6 + Math.floor(rnd() * 30);
    out.push([t, Math.min(t + len, 20 * 60)]);
    t += len + 8 + Math.floor(rnd() * 40);
  }
  return out;
}
const PRESENCE = { color: '#C4B5FD', idle: '#7C3AED' };
const IDLE_MIN = 8; // хв без жодної події при клієнтах у залі = «без обслуговування»

function activity(day, isToday) {
  const start = 8 * 60, end = 20 * 60, now = 14 * 60 + 31;
  const events = mockEvents(day).filter(e => !isToday || e.t <= now);
  const cx = 160, cy = 150, r = 108, w = 26;
  const a0 = 135, sweep = 270;
  const pt = (deg, rad) => { const a = deg * Math.PI / 180; return [cx + rad * Math.cos(a), cy + rad * Math.sin(a)]; };
  const arc = (from, to, rad) => { const [x1, y1] = pt(from, rad), [x2, y2] = pt(to, rad); return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${rad} ${rad} 0 ${to - from > 180 ? 1 : 0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  const angle = t => a0 + sweep * (t - start) / (end - start);

  let ticks = '';
  for (const e of events) {
    const a = angle(e.t), [x1, y1] = pt(a, r - w / 2 + 2), [x2, y2] = pt(a, r + w / 2 - 2);
    const c = `x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"`;
    // видима рисочка + прозора широка зона наведення (10 px) з підказкою
    ticks += `<line ${c} stroke="${ACT_TYPES[e.type].color}" stroke-width="2.5" stroke-linecap="round"></line>`
           + `<line class="ev" ${c} stroke="transparent" stroke-width="10" data-tip="${ACT_TYPES[e.type].label}, ${hhmm(e.t)}"></line>`;
  }
  // внутрішнє кільце: клієнти в залі (фіолетовий); без подій ≥ IDLE_MIN хв — темніший
  const rIn = r - w / 2 - 9, wIn = 8;
  const presence = mockPresence(day).filter(([a]) => !isToday || a <= now).map(([a, b]) => [a, isToday ? Math.min(b, now) : b]);
  let inner = '', idleN = 0, idleMin = 0;
  for (const [a, b] of presence) {
    const served = events.some(e => e.t >= a && e.t <= b);
    const idle = !served && b - a >= IDLE_MIN;
    if (idle) { idleN++; idleMin += b - a; }
    const tip = idle ? `Клієнти в залі без обслуговування, ${hhmm(a)}–${hhmm(b)} (${b - a} хв)` : `Клієнти в залі, ${hhmm(a)}–${hhmm(b)}`;
    inner += `<path class="ev" d="${arc(angle(a), angle(b), rIn)}" stroke="${idle ? PRESENCE.idle : PRESENCE.color}" stroke-width="${wIn}" fill="none" data-tip="${tip}"></path>`;
  }
  // маркери: початок зміни (зелений), кінець/зараз (сірий) — з «ніжкою» назовні
  const pin = (deg, color, tip) => { const [x1, y1] = pt(deg, r + w / 2 + 1), [x2, y2] = pt(deg, r + w / 2 + 16); return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#9CA3AF" stroke-width="1.5"></line><circle class="ev" cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="5" fill="${color}" data-tip="${tip}"></circle>`; };
  const nowA = angle(isToday ? now : end);
  const pins = pin(a0, '#5FB556', `Початок зміни, ${hhmm(start)}`) + pin(a0 + sweep, '#9CA3AF', `Кінець зміни, ${hhmm(end)}`)
    + (isToday ? `<line x1="${pt(nowA, r - w / 2 - 2)[0].toFixed(1)}" y1="${pt(nowA, r - w / 2 - 2)[1].toFixed(1)}" x2="${pt(nowA, r + w / 2 + 2)[0].toFixed(1)}" y2="${pt(nowA, r + w / 2 + 2)[1].toFixed(1)}" stroke="#1C1C2E" stroke-width="1.5" class="ev" data-tip="Зараз, ${hhmm(now)}"></line>` : '');
  const [lx, ly] = pt(a0, r + w / 2 + 36), [rx, ry] = pt(a0 + sweep, r + w / 2 + 36);
  const counts = {};
  for (const e of events) counts[e.type] = (counts[e.type] || 0) + 1;
  const legend = Object.entries(ACT_TYPES).map(([k, v]) => `<span><b style="background:${v.color}"></b>${v.label}${counts[k] ? ' · ' + counts[k] : ''}</span>`).join('')
    + `<span><b style="background:${PRESENCE.color}"></b>Клієнти в залі</span>`
    + `<span><b style="background:${PRESENCE.idle}"></b>Без обслуговування${idleN ? ' · ' + idleN : ''}</span>`;
  return `<div class="act" onmouseover="tipShow(event)" onmouseout="tipHide(event)">
    <svg viewBox="0 0 320 274">
      <path d="${arc(a0, a0 + sweep, r)}" stroke="#EEF0F3" stroke-width="${w}" fill="none" stroke-linecap="butt"></path>
      <path d="${arc(a0, a0 + sweep, rIn)}" stroke="#F4F5F8" stroke-width="${wIn}" fill="none" stroke-linecap="butt"></path>
      ${inner}${ticks}${pins}
      <text class="tm" x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle">${hhmm(start)}</text>
      <text class="tm" x="${rx.toFixed(1)}" y="${(ry + 4).toFixed(1)}" text-anchor="middle">${hhmm(end)}</text>
    </svg>
    <div class="sum"><b>${events.length}</b><span>подій за зміну</span>${idleN ? `<span style="display:block;margin-top:4px;color:${PRESENCE.idle};font-weight:600">${idleMin} хв без обслуговування</span>` : ''}</div>
    <div class="tip" id="acttip"></div>
  </div>
  <div class="legend" style="flex-wrap:wrap; gap:8px 14px">${legend}</div>`;
}
function tipShow(ev) {
  const el = ev.target.closest('.ev'); if (!el) return;
  const box = ev.currentTarget, tip = box.querySelector('.tip'), rb = box.getBoundingClientRect(), eb = el.getBoundingClientRect();
  tip.textContent = el.dataset.tip;
  tip.style.left = (eb.left + eb.width / 2 - rb.left) + 'px';
  tip.style.top = (eb.top - rb.top) + 'px';
  tip.style.display = 'block';
}
function tipHide(ev) { if (!ev.target.closest('.ev')) return; ev.currentTarget.querySelector('.tip').style.display = 'none'; }

// Мок «Потенціал росту» за день: мій результат vs середнє по колегах.
function growthRows(day) {
  const k = ((day * 7) % 11) / 10;  // детермінований «шум» 0..1
  const my = {
    avg: 150 + k * 60, len: 1.6 + k * 1.2, one: 62 - k * 25, tpk: 30 + k * 30,
    // лічильники за день — лише цілі в межах: 0–5, 0–4, 0–10
    custom: Math.round(k * 5), other: Math.round(k * 4), hand: Math.round(k * 10),
    tpkIz: 18 + k * 30,               // % конверсії ТПК в інтернет-замовлення
    edk: Math.round(k * 6),           // продажів ЄДК на відсутній товар, шт
  };
  const peers = { avg: 182.4, len: 2.3, one: 44, tpk: 47, tpkIz: 31, edk: 2.7, custom: 2.1, other: 1.4, hand: 3.6 };
  const row = (label, m, p, fmtM, fmtP, higherBetter) => {
    const better = higherBetter ? m >= p : m <= p;
    return `<tr><td>${label}</td><td class="r ${better ? 'better' : 'worse'}">${fmtM(m)}</td><td class="r">${fmtP(p)}</td></tr>`;
  };
  const money = v => v.toFixed(2).replace('.', ',');
  const num1 = v => v.toFixed(1).replace('.', ',');
  const pc = v => Math.round(v) + '%';
  const int = v => String(Math.round(v));
  return row('Середній чек', my.avg, peers.avg, money, money, true)
       + row('Довжина чека', my.len, peers.len, num1, num1, true)
       + row('Частка чеків з 1 позицією', my.one, peers.one, pc, pc, false)
       + row('Конверсія ТПК', my.tpk, peers.tpk, pc, pc, true)
       + row('Конверсія ТПК в ІЗ', my.tpkIz, peers.tpkIz, pc, pc, true)
       + row('Продажів ЄДК на відсутній товар', my.edk, peers.edk, int, num1, true)
       + row('Замовлень під клієнта', my.custom, peers.custom, int, num1, true)
       + row('Замовлень в іншу аптеку', my.other, peers.other, int, num1, true)
       + row('Знижки «Рука допомоги»', my.hand, peers.hand, int, num1, true);
}

// Горизонтальні смужки «ВТМ за категоріями»: назва, сума, частка від ВТМ.
function catBars(rows) {
  const max = Math.max(...rows.map(r => r[1]));
  return rows.map(([name, sum, n]) => `
    <div class="cat">
      <div class="cat-h"><span>${name}</span><span class="cat-n">${n} уп. · <b>${fmt(sum)} ₴</b></span></div>
      <div class="track"><div style="width:${sum / max * 100}%"></div></div>
    </div>`).join('');
}

// Накопичення ВТМ за місяць: факт (синя область) проти плану (пунктир).
// План у грн на місяць, розбитий по днях пропорційно плановим годинам
// фармацевта; у моку — лінійно.
function cumChart(dayFacts, monthPlan, today, daysInMonth) {
  const W = 320, H = 110, padB = 14, padT = 12;
  const cum = []; let s = 0;
  for (let i = 0; i < today; i++) { s += dayFacts[i] || 0; cum.push(s); }
  const max = Math.max(monthPlan, s) * 1.08;
  const x = i => (i / daysInMonth) * W;
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const pts = cum.map((v, i) => `${x(i + 1).toFixed(1)},${y(v).toFixed(1)}`);
  const area = `M${x(0)},${y(0)} L${pts.join(' L')} L${x(today).toFixed(1)},${y(0)} Z`;
  const line = `M${x(0)},${y(0)} L${pts.join(' L')}`;
  const met = s >= monthPlan;
  const onPace = s >= monthPlan * today / daysInMonth;   // факт ≥ план наростаючим на сьогодні
  const lc = onPace ? '#22C55E' : '#9CA3AF', fc = onPace ? '#22C55E' : '#E5E7EB', fo = onPace ? .14 : .6;
  return `<div class="cum"><svg viewBox="0 0 ${W} ${H}">
    <line x1="0" y1="${y(0)}" x2="${W}" y2="${y(0)}" stroke="#E5E7EB"></line>
    <line x1="0" y1="${y(0)}" x2="${W}" y2="${y(monthPlan)}" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5 4"></line>
    <path d="${area}" fill="${fc}" fill-opacity="${fo}"></path>
    <path d="${line}" fill="none" stroke="${lc}" stroke-width="2"></path>
    <circle cx="${x(today)}" cy="${y(s)}" r="4" fill="#1E7DC8" stroke="#fff" stroke-width="2"></circle>
    <line x1="${x(today)}" y1="${y(0)}" x2="${x(today)}" y2="${y(s) + 6}" stroke="#1E7DC8" stroke-width="1" stroke-dasharray="2 2"></line>
    <text class="lblb" x="${x(today) - 8}" y="${y(s) - 8}" text-anchor="end">${fmt(s)} ₴${met ? ' ✓' : ''}</text>
    <text class="lbl" x="0" y="${H - 2}">1 вер</text>
    <text class="lbl" x="${x(today)}" y="${H - 2}" text-anchor="middle">сьогодні</text>
    <text class="lbl" x="${W}" y="${H - 2}" text-anchor="end">30 вер</text>
  </svg></div>`;
}

        <div class="s">Продажі ВТМ уже перевищили план вересня. 20% від ${fmt(bonusBase)} додаткових балів за продажі препаратів; нарахується після закриття місяця.</div></div>
      </div>` : ''}

      <div class="section">${ICON} ВТМ ЗА МІСЯЦЬ: ФАКТ І ПЛАН <span class="tsel">план ${fmt(monthPlan)} ₴</span></div>
      ${cumChart(dayFacts, monthPlan, 23, 30)}
      <div class="note" style="margin-bottom:12px">План на місяць у гривнях, розбитий по днях пропорційно плановим годинам фармацевта. Пунктир — план наростаючим підсумком.</div>

      <div class="section">${ICON} ПРОПУЩЕНІ ЗАМІНИ НА ВТМ <span class="tsel">сьогодні</span></div>
      <table><tr><th>Продано бренд → є ВТМ</th><th class="r">К-сть</th><th class="r">Потенціал</th></tr>
        ${swaps.map(([b, a, n, s]) => `<tr><td>${b}<div class="swap">→ ${a}</div></td><td class="r">${n}</td><td class="r">+${fmt(s)} ₴</td></tr>`).join('')}
        <tr class="tot"><td>Разом</td><td class="r">${swaps.reduce((s, r) => s + r[2], 0)}</td><td class="r">+${fmt(swapSum)} ₴</td></tr>
      </table>
      <div class="note" style="margin-bottom:12px">Чеки, де клієнт узяв бренд, хоча в наявності був ВТМ-аналог. Потенціал — скільки ВТМ додало б до плану.</div>

      <div class="section">${ICON} ТОП ВТМ ЗА ЗМІНУ</div>
      <table><tr><th>Товар</th><th class="r">К-сть</th><th class="r">Сума</th></tr>
        <tr><td>Парацетамол АНЦ 500 мг №10</td><td class="r">${6 * k}</td><td class="r">${fmt(114 * k)},00</td></tr>
        <tr><td>Цитрамон АНЦ №10</td><td class="r">${4 * k}</td><td class="r">${fmt(92 * k)},00</td></tr>
        <tr><td>Лоратадин АНЦ №10</td><td class="r">${3 * k}</td><td class="r">${fmt(141 * k)},00</td></tr>
        <tr><td>Вітамін C АНЦ 500 мг №30</td><td class="r">${2 * k}</td><td class="r">${fmt(76 * k)},00</td></tr>
      </table>
    </div>
  </div>`;
}

function list(d) {
  return `${earned(d)}
    <div class="section">${ICON} ПОКАЗНИКИ ${scope === 'my' ? 'ЗА ЗМІНУ' : 'АПТЕКИ ЗА ЗМІНУ'}</div>
    ${seg()}
    <div class="kpis">
    ${kpiBar('Товарообіг', d.turnover, 'turnover')}
    ${kpiBar('Продаж ВТМ', d.vtm, 'vtm')}
    ${zfRow(d.zf)}
    </div>`;
}

function render() {
  const d = DATA[scope];
  const el = document.getElementById('app');
  const body = view === 'list' ? list(d) : view === 'zf' ? detailZf(d) : view === 'turnover' ? detailTurnover(d) : detailVtm(d);
  el.innerHTML = (view === 'list' ? '' : seg()) + body;
}
function showView(v) { view = v; render(); }
function setScope(s) { scope = s; render(); }
render();

</script>
</body>
</html>
